refresh_registry:
  name: Refresh Registry
  description: Immediately rebuilds the internal device and entity registry hierarchy. Use this after adding or removing devices/entities/labels in Home Assistant.

poll_unavailable:
  name: Poll Unavailable
  description: Immediately re-polls all entities for unavailability, without waiting for the next scheduled interval.

reload:
  name: Reload
  description: Reloads all SmartHass Entity Status config entries. Useful after changing configuration options.

get_registry:
  name: Get Registry
  description: Returns the complete cached device and entity mapping for every loaded integration entry as response data, including available and suppressed items. Request a response when calling this action; no entity is created or updated.
