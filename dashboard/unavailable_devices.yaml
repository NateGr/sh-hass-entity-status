views:
  - title: Unavailable Devices
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Unavailable Devices
            icon: mdi:cloud-question-outline
            multiline_secondary: true
            hold_action:
              action: none
            double_tap_action:
              action: none
            layout_options:
              grid_columns: 4
              grid_rows: auto
            color: >-
              {{ iif(
              states('sensor.sh_entity_status_unsuppressed_unavailable_count') |
              int > 0,"red") }}
            features_position: bottom
            secondary: >
              {% set items =
              state_attr('sensor.sh_entity_status_unsuppressed_unavailable_list',
              'devices') or [] %}

              {% set devices = items | map('combine',{'type': 'device'}) | list
              %}

              {% set items =
              state_attr('sensor.sh_entity_status_unsuppressed_unavailable_list',
              'entities') or [] %}

              {% set entities = items | map('combine',{'type': 'entity'}) | list
              %}

              {% set items = devices + entities%}

              {% for i in items %}{{ i.display_name }}

              {% else %}<none>{% endfor %}
          - type: custom:mushroom-template-card
            primary: Refresh Device List
            secondary: >-
              Last refreshed:
              {{states("sensor.sh_entity_status_last_registry_refresh") |
              as_datetime | relative_time}} ago
            icon: mdi:gesture-tap
            tap_action:
              action: toggle
            hold_action:
              action: none
            double_tap_action:
              action: none
            layout_options:
              grid_columns: 4
              grid_rows: 1
            color: blue
            features_position: bottom
            entity: button.sh_entity_status_refresh_registry
          - type: markdown
            content: >
              {% set items =
              state_attr('sensor.sh_entity_status_suppressed_unavailable_list',
              'devices') or [] %}

              {% set devices = items | map('combine',{'type': 'device'}) |
              sort(attribute='display_name') | list %}

              {% set items =
              state_attr('sensor.sh_entity_status_suppressed_unavailable_list',
              'entities') or [] %}

              {% set entities = items | map('combine',{'type': 'entity'}) | list
              %}

              {% set items = devices + entities%}

              {% for i in items %}{% if i.type == 'device'
              %}[{{i.display_name}}](/config/devices/device/{{i.id}}){% else %}
              {{i.display_name}}{% endif%}

              {% endfor %}
          - type: markdown
            content: >
              #### Suppress Devices

              {% set items =
              state_attr('sensor.sh_entity_status_unsuppressed_unavailable_list',
              'devices') or [] %}

              {% set devices = items | map('combine',{'type': 'device'}) | list
              %}

              {% set items =
              state_attr('sensor.sh_entity_status_unsuppressed_unavailable_list',
              'entities') or [] %}

              {% set entities = items | map('combine',{'type': 'entity'}) | list
              %}

              {% set items = devices + entities%}

              {% for i in items %}{% if i.type == 'device'
              %}[{{i.display_name}}](/config/devices/device/{{i.id}}){% else %}
              {{i.display_name}}{% endif%}

              {% endfor %}
            visibility:
              - condition: numeric_state
                entity: sensor.sh_entity_status_unsuppressed_unavailable_count
                above: 0
    subview: true
    max_columns: 1
    cards: []
