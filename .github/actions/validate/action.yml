name: Validate repository
description: Shared lint, type-check, test and HACS checks for CI and releases
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements_test.txt
    - name: Install test tools
      shell: bash
      run: python -m pip install -r requirements_test.txt
    - name: Lint
      shell: bash
      run: python -m ruff check .
    - name: Check formatting
      shell: bash
      run: python -m ruff format --check .
    - name: Type check
      shell: bash
      run: python -m mypy custom_components/sh_entity_status/ --ignore-missing-imports
    - name: Test
      shell: bash
      run: python -m pytest tests/ -v --cov=custom_components/sh_entity_status --cov-report=xml --cov-fail-under=80
    - name: Validate public HACS repository
      if: ${{ !github.event.repository.private }}
      uses: hacs/action@main
      with:
        category: integration
        repository: ${{ github.repository }}
        comment: "false"
