name: Validate repository
description: Shared lint, type-check, test and HACS checks for CI and releases
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements_test.txt
    - name: Install test tools
      shell: bash
      run: python -m pip install -r requirements_test.txt
    - name: Check integration readiness
      shell: bash
      run: python scripts/release.py check
    - name: Lint
      shell: bash
      run: python -m ruff check .
    - name: Check formatting
      shell: bash
      run: python -m ruff format --check .
    - name: Type check
      shell: bash
      run: python -m mypy custom_components/sh_entity_status/ --ignore-missing-imports
    - name: Test
      shell: bash
      run: python -m pytest tests/ -v --cov=custom_components/sh_entity_status --cov-report="xml:${RUNNER_TEMP}/coverage.xml" --cov-fail-under=80
    - name: Validate Home Assistant metadata
      uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
    - name: Validate public HACS repository
      if: ${{ !github.event.repository.private }}
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration
        repository: ${{ github.repository }}
        comment: "false"
