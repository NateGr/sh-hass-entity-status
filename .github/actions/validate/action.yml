name: Validate repository
description: Shared lint, type-check, test and HACS checks for CI and releases
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.14.2'
        cache: pip
        cache-dependency-path: |
          requirements_test.txt
          requirements/latest/requirements.txt
    - name: Install test tools
      shell: bash
      run: python -m pip install -r requirements_test.txt
    - name: Check integration readiness
      shell: bash
      run: python scripts/release.py check
    - name: Lint
      shell: bash
      run: python -m ruff check .
    - name: Check formatting
      shell: bash
      run: python -m ruff format --check --exclude '*.md' .
    - name: Type check
      shell: bash
      run: python -m mypy custom_components/sh_entity_status/ --ignore-missing-imports
    - name: Verify minimum Home Assistant baseline
      shell: bash
      run: python scripts/check_ha_compatibility.py minimum
    - name: Test minimum Home Assistant
      shell: bash
      run: python -m pytest tests/ --cov=scripts --cov=custom_components/sh_entity_status --cov-report=term-missing --cov-report="xml:${RUNNER_TEMP}/coverage-minimum.xml"
    - name: Enforce minimum integration coverage
      shell: bash
      run: python -m coverage report --include='*/custom_components/sh_entity_status/*' --fail-under=80
    - name: Install latest fixture environment
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/ha-latest"
        "$RUNNER_TEMP/ha-latest/bin/python" -m pip install -r requirements/latest/requirements.txt
    - name: Verify latest fixture baseline
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" scripts/check_ha_compatibility.py latest'
    - name: Test latest fixture Home Assistant
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" -m pytest tests/ --cov=scripts --cov=custom_components/sh_entity_status --cov-report=term-missing --cov-report="xml:${RUNNER_TEMP}/coverage-latest.xml"'
    - name: Enforce latest integration coverage
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" -m coverage report --include="*/custom_components/sh_entity_status/*" --fail-under=80'
    - name: Validate Home Assistant metadata
      uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
    - name: Validate public HACS repository
      if: ${{ !github.event.repository.private }}
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration
        repository: ${{ github.repository }}
        comment: "false"
