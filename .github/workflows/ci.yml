name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Verify Ruff installation
        run: python -m ruff --version

      - name: Run Ruff
        run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest tests/ -v
