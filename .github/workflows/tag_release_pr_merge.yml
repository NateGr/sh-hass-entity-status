name: Tag Release PR Merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  tag_release:
    name: Tag and publish after release PR merge
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Derive version from release branch
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not derive semantic version from head ref: $HEAD_REF" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify merged manifest version matches branch version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          manifest = json.loads(Path('custom_components/sh_entity_status/manifest.json').read_text())
          if manifest['version'] != version:
              raise SystemExit(
                  f"Merged manifest version {manifest['version']} does not match release version {version}"
              )
          PY

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin." >&2
            exit 1
          fi
          git tag -a "v$VERSION" "$MERGE_SHA" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Run HACS validation
        if: ${{ !github.event.repository.private }}
        uses: hacs/action@main
        with:
          category: integration

      - name: Build release archive
        run: zip -r sh_entity_status.zip custom_components/sh_entity_status hacs.json README.md LICENSE CHANGELOG.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: sh_entity_status.zip
          generate_release_notes: true