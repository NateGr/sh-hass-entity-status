name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  release:
    name: Tag & Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in manifest.json
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            custom_components/sh_entity_status/manifest.json \
            > manifest.tmp && mv manifest.tmp \
            custom_components/sh_entity_status/manifest.json

      - name: Commit version bump
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/sh_entity_status/manifest.json
          git commit -m "Bump version to $VERSION"
          git push

      - name: Create and push tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build release archive
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: zip -r "sh_entity_status_v${VERSION}.zip" custom_components/sh_entity_status hacs.json README.md LICENSE CHANGELOG.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: sh_entity_status_v${{ github.event.inputs.version }}.zip
          generate_release_notes: true
