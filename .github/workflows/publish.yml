name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3) — leave blank to auto-increment patch'
        required: false
        default: ''

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Verify Ruff installation
        run: python -m ruff --version

      - name: Run Ruff
        run: python -m ruff check .

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  release:
    name: Tag & Release
    needs: [ci, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            CURRENT=$(jq -r '.version' custom_components/sh_entity_status/manifest.json)
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in manifest.json
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            custom_components/sh_entity_status/manifest.json \
            > manifest.tmp && mv manifest.tmp \
            custom_components/sh_entity_status/manifest.json

      - name: Commit version bump
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/sh_entity_status/manifest.json
          git commit -m "Bump version to $VERSION"
          git push

      - name: Create and push tag
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build release archive
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: zip -r "sh_entity_status_v${VERSION}.zip" custom_components/sh_entity_status hacs.json README.md LICENSE CHANGELOG.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.resolve_version.outputs.VERSION }}
          name: v${{ steps.resolve_version.outputs.VERSION }}
          files: sh_entity_status_v${{ steps.resolve_version.outputs.VERSION }}.zip
          generate_release_notes: true
