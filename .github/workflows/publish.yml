name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3) — leave blank to auto-increment patch'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-release-${{ github.event.inputs.version || 'auto' }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install lint dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Verify Ruff installation
        run: python -m ruff --version

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  release:
    name: Prepare Release PR
    needs: [ci, hacs]
    if: ${{ needs.ci.result == 'success' && (needs.hacs.result == 'success' || needs.hacs.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            CURRENT=$(jq -r '.version' custom_components/sh_entity_status/manifest.json)
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic (x.y.z). Got: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin." >&2
            exit 1
          fi

      - name: Bump version in manifest.json
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            custom_components/sh_entity_status/manifest.json \
            > manifest.tmp && mv manifest.tmp \
            custom_components/sh_entity_status/manifest.json

      - name: Prepare release branch name
        id: branch_name
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        run: |
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        env:
          VERSION: ${{ steps.resolve_version.outputs.VERSION }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: prepare release v${{ steps.resolve_version.outputs.VERSION }}"
          branch: ${{ steps.branch_name.outputs.BRANCH }}
          base: main
          title: "chore: prepare release v${{ steps.resolve_version.outputs.VERSION }}"
          body: |
            Automated release PR for `v${{ steps.resolve_version.outputs.VERSION }}`.

            What this PR does:
            - bumps `custom_components/sh_entity_status/manifest.json` to `${{ steps.resolve_version.outputs.VERSION }}`
            - runs required PR checks
            - leaves final approval and merge to a maintainer

            After merge, a release workflow will create `v${{ steps.resolve_version.outputs.VERSION }}` and publish the GitHub release.
          add-paths: |
            custom_components/sh_entity_status/manifest.json

      - name: Ensure a release PR was opened
        if: ${{ steps.create_pr.outputs.pull-request-number == '' }}
        run: |
          echo "No release PR was created. This usually means there were no file changes to commit." >&2
          exit 1

      - name: Show next action
        if: ${{ steps.create_pr.outputs.pull-request-number != '' }}
        run: |
          echo "Release PR #${{ steps.create_pr.outputs.pull-request-number }} is ready for manual approval and merge."
