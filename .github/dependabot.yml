version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # Upgrade the Home Assistant test stack together with its Python requirements.
    ignore:
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "pytest-cov"
      - dependency-name: "pytest-socket"
    groups:
      test-tools:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/requirements/latest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"